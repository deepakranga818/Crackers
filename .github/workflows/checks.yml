name: Validate catalogue and request flow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Deterministic: every test serves fixture CSV in place of the Google Sheet, so a sheet or
  # network change cannot fail a test. The real-sheet check is separate (`npm run test:live`).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            reports/browser-results.json
            reports/layout-metrics.json
            reports/redesign
          retention-days: 7
