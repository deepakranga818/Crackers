name: Deploy to GitHub Pages
# Private friends-and-family site (audience "private-friends" in source/publication-approval.json).
# GitHub Pages terms bar sites primarily facilitating commercial transactions and Pages URLs are
# public, so this is not an approved production host. The gate below passes only for the private
# audience (which must stay noindex) or once a public launch has full evidence recorded.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-publication.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The build contains no catalogue data: the page reads the Google Sheet when it loads.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
